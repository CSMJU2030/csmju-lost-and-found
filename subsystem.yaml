# manifest ของระบบย่อย — CI และ conformance อ่านไฟล์นี้ไฟล์เดียว
# schema: standards/schemas/subsystem.schema.json

name: csmju-lost-and-found          # ต้องตรงกับทะเบียนใน Core Hub และกับ data.service ของ /api/health
standards_version: "1.0.0"
conformance_level: L3                 # L1 · L2 · L3 (ระบบที่มี UI ต้องถึง L3)

# frontend (Next.js :3002) ส่งต่อ /api /uploads และ /auth/callback ไปที่ backend (NestJS :4000)
# เบราว์เซอร์จึงเห็นระบบนี้เป็น origin เดียว — callback_url ที่ลงทะเบียน = http://localhost:3002/auth/callback
base_url: http://localhost:3002       # URL ของระบบย่อยตอนรันเพื่อทดสอบ
core_hub_url: http://localhost:3000
callback_path: /auth/callback         # ต้องตรงกับ callback_url ที่ลงทะเบียนไว้

public_endpoints:
  - GET /api/health
  - GET /auth/callback

# core role -> subsystem role (ต้องตรงกับ backend/src/auth/role-mapping.ts และ default_role_mapping ในทะเบียน)
default_role_mapping:
  student: STUDENT
  alumni: ALUMNI
  staff: STAFF
  admin: ADMIN

# conformance ใช้ probes ตรวจสัญญา API — ประกาศไม่ครบ = ขึ้น SKIP = ยังไม่ผ่าน
probes:
  collection: /api/v1/items
  not_found: /api/v1/items/99999999-9999-4999-8999-999999999999
  invalid_id: /api/v1/items/not-a-uuid
  # POST /items เปิดให้นักศึกษาด้วย จึงใช้ endpoint เขียนที่เป็นของเจ้าหน้าที่เท่านั้น:
  # staff + body ผิด -> 400 VALIDATION_ERROR · student + body ถูก -> 403 FORBIDDEN (guard ตรวจก่อน validation)
  create:
    path: /api/v1/claims/99999999-9999-4999-8999-999999999999/verify
    allowed_role: staff
    denied_role: student
    invalid_body:
      code: nope
    valid_body:
      code: "123456"

owners:
  pl: "@csmju2030/pl-lost-and-found"
  aie: "@csmju2030/aie-lost-and-found"

display_name: "Lost and Found"
repo: github.com/CSMJU2030/csmju-lost-and-found
status: proposed
