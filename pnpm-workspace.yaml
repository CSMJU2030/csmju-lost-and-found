packages:
  - 'backend'
  - 'frontend'

# pnpm 10+ บล็อก build script ของ dependency โดยค่าเริ่มต้น
# Prisma ต้องรัน postinstall เพื่อเตรียม engine จึงต้องอนุญาตไว้
allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': false
  prisma: true
  unrs-resolver: true
